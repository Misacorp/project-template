name: template

# Only in the template repository: bootstrap/init.mjs deletes this file. Proves that every combination of
# environments and stacks bootstraps into a project whose own checks pass, so a template change can't break a
# project that is started from it later.
on:
  pull_request:

permissions: {}

concurrency:
  group: template-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: bootstrap (${{ matrix.stack }}, ${{ matrix.environments }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stack: [none, cloudflare-web]
        environments: [production, 'production,staging']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: node --test 'bootstrap/*.test.mjs'

      - name: Bootstrap a sample project
        env:
          STACK: ${{ matrix.stack }}
          ENVIRONMENTS: ${{ matrix.environments }}
        run: node bootstrap/smoke.mjs --stack "$STACK" --environments "$ENVIRONMENTS" --out "$RUNNER_TEMP/sample"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.stack == 'cloudflare-web'
        with:
          package_json_file: bootstrap/stacks/cloudflare-web/files/package.json

      - name: Run the sample project's checks
        env:
          SAMPLE: ${{ runner.temp }}/sample
          STACK: ${{ matrix.stack }}
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          cd "$SAMPLE"
          "$RUNNER_TEMP/actionlint" -color
          node scripts/decisions.mjs check
          node --test 'scripts/*.test.mjs'
          if [ "$STACK" = "cloudflare-web" ]; then
            pnpm install --frozen-lockfile
            pnpm check
          fi
